[project]
name = "docsislab"
version = "0.1.0"
description = "A virtual DOCSIS 2.0 CMTS and cable modem over a simulated HFC plant"
requires-python = ">=3.11"
# No third-party dependencies: everything is Python standard library.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
docsis = "docsislab.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["docsislab*"]
